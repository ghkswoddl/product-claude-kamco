const NAVY = "#005088";
const NAVY_DARK = "#003a63";

/* ---------- 공통 렌더 헬퍼 ---------- */
function esc(s){ return (s===undefined||s===null) ? "" : String(s); }

function badge(text, tone){
  tone = tone || "blue";
  const tones = {
    blue: "bg-blue-50 text-[#0C447C]",
    gray: "bg-gray-100 text-gray-600",
    red: "bg-red-50 text-red-700",
    amber: "bg-amber-50 text-amber-700",
    green: "bg-green-50 text-green-700",
  };
  return `<span class="text-[11px] px-2 py-0.5 rounded ${tones[tone]} font-medium">${esc(text)}</span>`;
}

function statusPill(label, tone){
  tone = tone || "gray";
  const map = {
    gray: "bg-gray-100 text-gray-600",
    blue: "bg-blue-50 text-blue-700",
    green: "bg-green-50 text-green-700",
    amber: "bg-amber-50 text-amber-700",
    red: "bg-red-50 text-red-700",
  };
  return `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${map[tone]}">${esc(label)}</span>`;
}

function screenHeader(sfr, name, screenId, note){
  return `
  <div class="mb-5">
    <div class="flex items-center gap-2 mb-1">${badge(sfr,"blue")}${badge(screenId,"gray")}</div>
    <h1 class="text-lg font-medium text-gray-900">${esc(name)}</h1>
    ${note ? `<p class="text-xs text-gray-500 mt-1">${esc(note)}</p>` : ""}
  </div>`;
}

function card(opts){
  const icon = opts.icon ? `<i data-lucide="${opts.icon}" style="color:${NAVY}"></i>` : "";
  const tag = opts.tag ? `<span class="ml-auto">${opts.tag}</span>` : "";
  return `
  <div class="bg-white rounded-xl border border-gray-200 p-5 mb-4">
    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
      ${icon}<h2 class="text-[15px] font-medium text-gray-900">${esc(opts.title)}</h2>${tag}
    </div>
    ${opts.content}
  </div>`;
}

function field(label, opts){
  opts = opts || {};
  return `
  <div class="mb-3">
    <label class="text-[13px] font-medium text-gray-700 block mb-1.5">${esc(label)} ${opts.required ? '<span class="text-red-600">*</span>' : ""}</label>
    ${opts.content}
    ${opts.hint ? `<p class="text-[11px] text-gray-400 mt-1">${esc(opts.hint)}</p>` : ""}
  </div>`;
}

function inputEl(attrs){
  attrs = attrs || "";
  return `<input ${attrs} class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px] focus:outline-none focus:ring-1 focus:ring-[#005088]" />`;
}
function textareaEl(attrs, val){
  attrs = attrs || "";
  return `<textarea ${attrs} class="w-full border border-gray-300 rounded-md p-2 text-[13px]">${esc(val||"")}</textarea>`;
}
function selectEl(options, attrs){
  attrs = attrs || "";
  return `<select ${attrs} class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px] bg-white">${options.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
}

function btn(text, opts){
  opts = opts || {};
  const size = opts.small ? "px-3 py-1.5 text-[12px]" : "px-4 py-2 text-[13px]";
  const tone = opts.primary ? "text-white border border-transparent" : "text-gray-700 border border-gray-300 bg-white hover:bg-gray-50";
  const style = opts.primary ? `style="background:${NAVY}"` : "";
  const icon = opts.icon ? `<i data-lucide="${opts.icon}" class="w-[14px] h-[14px]"></i>` : "";
  const onclick = opts.onclick ? `onclick="${opts.onclick}"` : "";
  return `<button ${onclick} ${style} class="inline-flex items-center gap-1.5 rounded-md font-medium ${size} ${tone}">${icon}${esc(text)}</button>`;
}

function table(cols, rows, rowPaths){
  const thead = cols.map(c=>`<th class="text-left font-medium px-3 py-2 border-b border-gray-200">${esc(c)}</th>`).join("");
  const trs = rows.map((r,i)=>{
    const path = rowPaths && rowPaths[i];
    const cls = path ? "border-b border-gray-100 last:border-0 cursor-pointer hover:bg-blue-50/60" : "border-b border-gray-100 last:border-0";
    const onclick = path ? `onclick="navigate('${path}')"` : "";
    return `<tr ${onclick} class="${cls}">${r.map(c=>`<td class="px-3 py-2 text-gray-700">${c}</td>`).join("")}</tr>`;
  }).join("");
  return `<div class="border border-gray-200 rounded-lg overflow-hidden"><table class="w-full text-[12px]"><thead><tr class="bg-gray-50 text-gray-500">${thead}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function tabs(items, active){
  return `<div class="flex gap-1 mb-4 border-b border-gray-200">${items.map(t=>{
    const on = t===active;
    return `<div class="px-3 py-2 text-[13px] font-medium border-b-2 ${on?"border-[#005088] text-[#005088]":"border-transparent text-gray-500"}">${esc(t)}</div>`;
  }).join("")}</div>`;
}

function checklist(items){
  return `<div class="space-y-2">${items.map((it,i)=>`
    <label class="flex items-center gap-2 text-[13px] text-gray-700">
      <input type="checkbox" ${i%2===0?"checked":""} class="rounded border-gray-300" /> ${esc(it)}
    </label>`).join("")}</div>`;
}

function ipNotice(){
  return `<div class="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-md px-3 py-2 text-[12px] text-amber-800 mb-4">
    <i data-lucide="shield-check" class="w-[14px] h-[14px]"></i>
    지정된 IP에서만 접속 가능한 특수고객 창구입니다 (SFR-온기업-002 인증 정책)
  </div>`;
}

function backBar(to, label){
  return `<button onclick="navigate('${to}')" class="flex items-center gap-1.5 text-[12px] font-medium text-gray-500 hover:text-[#005088] mb-4">
    <i data-lucide="arrow-left" class="w-[14px] h-[14px]"></i> ${esc(label)} 목록으로
  </button>`;
}

function infoGrid(items){
  return `<div class="grid grid-cols-2 gap-x-6 gap-y-3">${items.map(([l,v])=>`
    <div><p class="text-[11px] text-gray-400 mb-0.5">${esc(l)}</p><p class="text-[13px] text-gray-800 font-medium">${v}</p></div>`).join("")}</div>`;
}

function timeline(steps, current){
  return `<div class="flex items-center">${steps.map((s,i)=>{
    const active = i<=current;
    const circle = i<current
      ? `<i data-lucide="check-circle-2" class="w-[14px] h-[14px]"></i>`
      : String(i+1);
    const circleCls = active ? "w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-medium text-white" : "w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-medium bg-white border border-gray-300 text-gray-400";
    const circleStyle = active ? `style="background:${NAVY}"` : "";
    const label = `<span class="text-[10.5px] mt-1.5 text-center ${active?"font-medium":"text-gray-400"}" ${active?`style="color:${NAVY}"`:""}>${esc(s)}</span>`;
    const bar = i<steps.length-1 ? `<div class="flex-1 h-0.5 mb-5" style="background:${i<current?NAVY:"#E5E7EB"}"></div>` : "";
    return `<div class="flex flex-col items-center flex-1"><div ${circleStyle} class="${circleCls}">${circle}</div>${label}</div>${bar}`;
  }).join("")}</div>`;
}

function gnbHtml(title, sub){
  return `
  <div>
    <div class="flex items-center justify-between px-6 h-14 text-white" style="background:${NAVY}">
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 bg-white rounded flex items-center justify-center text-[12px] font-medium" style="color:${NAVY}">캠</div>
        <span class="text-[15px] font-medium">온기업(OnCorp)</span>
        ${sub ? `<span class="text-white bg-white/20 px-2 py-0.5 rounded text-[11px] font-medium">${esc(sub)}</span>` : ""}
      </div>
      <div class="flex items-center gap-4 text-[12px] text-blue-100">
        <i data-lucide="bell" class="w-[15px] h-[15px]"></i>
        <span>My Page</span>
        <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center"><i data-lucide="user" class="w-[14px] h-[14px]"></i></div>
      </div>
    </div>
    <div class="bg-white px-6 py-2 text-[12px] text-gray-500 border-b border-gray-200 flex items-center gap-1.5">
      <i data-lucide="home" class="w-[13px] h-[13px]"></i><span>홈</span><i data-lucide="chevron-right" class="w-[12px] h-[12px]"></i><span style="color:${NAVY}" class="font-medium">${esc(title)}</span>
    </div>
  </div>`;
}

function shell(gnbTitle, gnbSub, content){
  return `<div class="bg-[#F5F7FA] rounded-xl overflow-hidden border border-gray-200">${gnbHtml(gnbTitle, gnbSub)}<div class="p-7">${content}</div></div>`;
}

/* ---------- 보고화면 공용 템플릿 (023~029, 031) ---------- */
function reportHistory(data, screenId, cols){
  const rows = data.map(d=>d.row);
  const paths = data.map(d=>`/${screenId}/${d.id}`);
  return card({icon:"clock", title:"최근 보고 이력 (클릭 시 상세 조회)", content: table(cols, rows, paths)});
}
function reportDetail(item, screenId, sfr, screenLabel, listName){
  return `
  ${backBar("/"+screenId, listName)}
  ${screenHeader(sfr, screenLabel+" 상세", "ONC-SCR-"+screenId, item.title)}
  ${card({icon:"file-text", title:"보고 기본정보", content: infoGrid(item.info)})}
  ${card({icon:"refresh-cw", title:"진행상태", content: timeline(["작성","전송","공사 접수","확정"], item.stage)})}
  ${item.content ? card({icon:"clipboard-list", title:"보고 내용", content:`<p class="text-[13px] text-gray-700 leading-relaxed">${esc(item.content)}</p>`}) : ""}
  ${card({icon:"paperclip", title:"첨부파일", content:`
    <div class="flex items-center justify-between border rounded-lg p-3 text-[12px]">
      <div class="flex items-center gap-2"><i data-lucide="file-text" style="color:${NAVY}"></i>${esc(item.file||"보고서_첨부.pdf")}</div>
      ${btn("다운로드",{small:true,icon:"download"})}
    </div>`})}
  <div class="flex justify-end gap-2">${btn("수정")}${btn("재전송",{primary:true,icon:"send"})}</div>
  `;
}

/* ---------- 해시 라우터 + 메인 렌더 ---------- */
function navigate(path){ window.location.hash = path; }
window.navigate = navigate;

function getPath(){
  return window.location.hash.replace(/^#/, "") || "/011";
}

function render(){
  const path = getPath();
  const segments = path.split("/").filter(Boolean);
  const screenId = segments[0] || "011";
  const detailId = segments[1];
  const groups = [];
  SCREENS.forEach(s=>{ if(groups.indexOf(s.group)===-1) groups.push(s.group); });

  const sidebarHtml = groups.map(g=>{
    const items = SCREENS.filter(s=>s.group===g).map(s=>{
      const active = screenId===s.id;
      const style = active ? `style="background:#E6F1FB;color:${NAVY_DARK};border-right:3px solid ${NAVY}"` : "";
      const cls = active ? "w-full text-left px-4 py-2 text-[12.5px] flex items-center gap-2 font-medium" : "w-full text-left px-4 py-2 text-[12.5px] flex items-center gap-2 text-gray-600 hover:bg-gray-50";
      return `<button onclick="navigate('/${s.id}')" ${style} class="${cls}"><span class="font-mono text-[10px] text-gray-400 w-8">${s.id}</span>${s.name}</button>`;
    }).join("");
    return `<div class="py-2"><p class="px-4 text-[11px] font-medium text-gray-400 uppercase mb-1">${g}</p>${items}</div>`;
  }).join("");

  const renderFn = SCREEN_RENDER[screenId] || SCREEN_RENDER["011"];
  const contentHtml = renderFn(detailId);

  const breadcrumbHtml = `<div class="mb-2 flex items-center gap-1.5 text-[11px] text-gray-400"><span>#${path}</span>${detailId?`<i data-lucide="chevron-right" class="w-[11px] h-[11px]"></i><span class="text-gray-500">상세보기</span>`:""}</div>`;

  document.getElementById("app").innerHTML = `
    <div class="flex bg-gray-100 min-h-screen w-full">
      <div class="w-64 bg-white border-r border-gray-200 overflow-y-auto" style="max-height:100vh">
        <div class="px-4 py-4 border-b border-gray-100">
          <p class="text-[13px] font-medium" style="color:${NAVY}">온기업(OnCorp) 화면설계서</p>
          <p class="text-[11px] text-gray-400 mt-0.5">SFR-온기업-002 ~ 032 · 목록/상세 라우팅 지원</p>
        </div>
        ${sidebarHtml}
      </div>
      <div class="flex-1 p-6 overflow-y-auto" style="max-height:100vh">
        ${breadcrumbHtml}
        ${contentHtml}
      </div>
    </div>
  `;
  if(window.lucide) window.lucide.createIcons();
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
render();
</script>
